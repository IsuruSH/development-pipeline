[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-pipeline"
version = "0.1.0"
description = "AI-native, spec-driven development pipeline orchestrated with LangGraph + Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Newton Russell Technical Assessment" }]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "bandit>=1.7.9",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
spec-pipeline = "run_pipeline:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
exclude = ["src*", "tests*", "audit_logs*", "specs*"]

[tool.setuptools.package-data]
"pipeline.prompts" = ["*.md"]

# ---------------------------------------------------------------------------
# Tool configuration. These configs are used both for the *pipeline itself*
# (CI workflow) and for the *generated code* (quality gates stage).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["audit_logs", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
# B008: Typer / FastAPI idiom puts `Argument(...)` / `Option(...)` in defaults.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["audit_logs/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "acceptance: maps directly to an acceptance criterion from the spec",
]

[tool.bandit]
exclude_dirs = ["tests", "audit_logs", ".venv", "build"]
