name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: lint + types + pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pipeline + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (pipeline source)
        run: ruff check pipeline run_pipeline.py

      - name: Mypy (pipeline source)
        run: mypy pipeline run_pipeline.py

      - name: Pytest (pipeline own tests)
        # Run only the hand-written pipeline tests (e.g. sandbox guard).
        # Generated tests live in tests/test_*.py and require an end-to-end run.
        run: pytest tests/pipeline_*.py
